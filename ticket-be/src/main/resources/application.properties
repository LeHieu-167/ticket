spring.application.name=ticket

# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/ticket_db
spring.datasource.username=user
spring.datasource.password=pass
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=MySecretKeyForJWTTokenGenerationAndValidationThatShouldBeLongEnoughAndSecure123456
jwt.expiration=86400000
jwt.access-token.expiration=1800000
jwt.refresh-token.expiration=604800000

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=ticket-order-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.acks=all
spring.kafka.producer.retries=3

# Kafka Topics
kafka.topic.order-requests=order_requests

# Redis Configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.password=
spring.data.redis.timeout=60000
spring.data.redis.jedis.pool.max-active=8
spring.data.redis.jedis.pool.max-idle=8
spring.data.redis.jedis.pool.min-idle=0

# Redisson Configuration
spring.redis.redisson.file=classpath:redisson-config.yml

# VNPay Configuration
vnpay.tmn-code=RT7D2ML7
vnpay.secret-key=WY6NCAHE1W1HPA2PPBH1TGIM7EMQK47D
vnpay.return-url=http://localhost:8080/api/payment/vnpay-return
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.api-url=https://sandbox.vnpayment.vn/merchant_webapi/api/transaction
vnpay.version=2.1.0
vnpay.command=pay
vnpay.order-type=other

# Application Base URL (for ticket verification)
app.base-url=http://localhost:8080

# File Upload Configuration
file.upload-dir=uploads
file.max-size=5242880

# Spring Servlet Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=50MB

# CORS Configuration
app.cors.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

# Frontend URL (for VNPay redirect)
app.frontend-url=http://localhost:3000

